name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests (analysis, export, set maker)
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blend-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish the APK as the "latest" release (direct download for the phone)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Blend.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Blend.apk --title "Blend — latest build" \
            --notes "Version 0.1.${GITHUB_RUN_NUMBER} · built from ${GITHUB_SHA::7}. Open on the phone, download Blend.apk, tap to install." --latest
